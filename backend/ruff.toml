line-length = 100
target-version = "py314"
src = ["src", "tests"]

[lint]
select = [
    "E",
    "W",
    "F",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "T20",
    "RUF",
    "TID",
]

ignore = [
    "COM812",
    "ISC001",
    "ARG001",
    "RUF001",
    "T201",
]

fixable = ["ALL"]
unfixable = [
    "B904",
]

[lint.isort]
known-first-party = ["app"]
combine-as-imports = true
force-sort-within-sections = true
split-on-trailing-comma = true


[lint.per-file-ignores]
# Protocol contracts intentionally use Russian docstrings.
"src/free_dots_vpn/application/**/interfaces.py" = ["RUF002"]
"tests/**/*.py" = [
    "ARG002",
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"


[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
